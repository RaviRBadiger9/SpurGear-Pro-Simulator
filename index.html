<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpurGear Pro | Industrial Gearbox Design Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f1f5f9; overflow-x: hidden; }
        .mono { font-family: monospace; }
        header { height: 56px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 20; }
        .app-container { display: flex; flex-direction: row; min-height: calc(100vh - 56px); }
        aside.sidebar-left { width: 320px; padding: 20px; overflow-y: auto; background: #0f172a; border-right: 1px solid #1e293b; }
        main.viewport-center { flex: 1; background: #1e293b; position: relative; }
        aside.sidebar-right { width: 400px; padding: 20px; overflow-y: auto; background: #0f172a; border-left: 1px solid #1e293b; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        input, select { background: #1e293b; border: 1px solid #475569; color: #f8fafc; padding: 6px; width: 100%; border-radius: 4px; }
        .math-ledger { background: #090d16; padding: 15px; border-radius: 8px; font-size: 12px; }
        .math-step { margin-bottom: 10px; color: #cbd5e1; border-bottom: 1px solid #1e293b; padding-bottom: 5px; }
        .math-formula { color: #38bdf8; font-weight: bold; font-family: monospace; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="main-engine">
    <header>
        <h1>SpurGear Pro // Analysis Engine</h1>
    </header>
    <div class="app-container">
        <aside class="sidebar-left">
            <div class="input-group"><label>Power (kW)</label><input type="number" id="in-p" value="15" oninput="updateDesign()"></div>
            <div class="input-group"><label>RPM</label><input type="number" id="in-n" value="1200" oninput="updateDesign()"></div>
            <div class="input-group"><label>Pinion Z1</label><input type="number" id="z1" value="20" oninput="updateDesign()"></div>
            <div class="input-group"><label>Gear Z2</label><input type="number" id="z2" value="50" oninput="updateDesign()"></div>
            <div class="input-group"><label>Module (m)</label><select id="module-sel" onchange="updateDesign()"><option value="2">2.0</option><option value="3" selected>3.0</option></select></div>
            <div class="input-group"><label>Load Type</label><select id="load-type" onchange="updateDesign()"><option value="steady">Steady</option><option value="medium" selected>Medium</option></select></div>
            <div class="input-group"><label>Duty Cycle</label><select id="service-type" onchange="updateDesign()"><option value="standard" selected>10h/Day</option></select></div>
        </aside>

        <main class="viewport-center" id="render-area"></main>

        <aside class="sidebar-right">
            <h3>Calculated Performance</h3>
            <div id="math-ledger-output" class="math-ledger"></div>
        </aside>
    </div>
</div>

<script>
    const serviceFactorTable = {
        steady: { standard: 1.0 },
        medium: { standard: 1.5 }
    };

    function updateDesign() {
        const P = parseFloat(document.getElementById('in-p').value);
        const n1 = parseFloat(document.getElementById('in-n').value);
        const z1 = parseFloat(document.getElementById('z1').value);
        const z2 = parseFloat(document.getElementById('z2').value);
        const m = parseFloat(document.getElementById('module-sel').value);
        const loadType = document.getElementById('load-type').value;
        const duty = document.getElementById('service-type').value;
        
        const b = 10 * m; 
        const i = z2 / z1;
        const d1 = m * z1;
        const v = (Math.PI * d1 * n1) / 60000;
        const Ft = (P * 1000) / (v || 0.001);
        const serviceFactor = serviceFactorTable[loadType][duty];
        const Cv = 3 / (3 + v);
        const Y = 0.484 - (2.87 / z1); 
        const sigmaB = (Ft * serviceFactor) / (Cv * b * m * Y);

        document.getElementById('math-ledger-output').innerHTML = `
            <div class="math-step">Ratio (i): <div class="math-formula">${i.toFixed(2)} : 1</div></div>
            <div class="math-step">Tangential Force (Ft): <div class="math-formula">${Ft.toFixed(0)} N</div></div>
            <div class="math-step">Service Factor: <div class="math-formula">${serviceFactor.toFixed(2)}</div></div>
            <div class="math-step">Velocity Factor (Cv): <div class="math-formula">${Cv.toFixed(3)}</div></div>
            <div class="math-step">Lewis Bending Stress: <div class="math-formula">${sigmaB.toFixed(2)} MPa</div></div>
        `;
    }

    // Initialize
    updateDesign();
</script>
</body>
</html>
