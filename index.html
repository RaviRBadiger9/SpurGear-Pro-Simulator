<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpurGear Pro Ultimate</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

body{
    margin:0;
    overflow:hidden;
    background:#0f172a;
    color:white;
    font-family:Inter,sans-serif;
}

.glass{
    background:rgba(15,23,42,.9);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
}

input,select{
    width:100%;
    background:#1e293b;
    border:1px solid #475569;
    padding:8px;
    border-radius:6px;
    color:white;
    font-size:12px;
}

#render-area{
    width:100%;
    height:100vh;
}

.panel{
    width:330px;
    height:100vh;
    overflow:auto;
    padding:20px;
}

.label{
    font-size:10px;
    text-transform:uppercase;
    color:#94a3b8;
    margin-bottom:4px;
    font-weight:700;
}

.card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:10px;
    padding:14px;
    margin-top:14px;
}

.title{
    color:#60a5fa;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="flex">

<!-- LEFT PANEL -->
<div class="panel glass">

<h1 class="text-xl font-bold mb-6 text-blue-400">
SPURGEAR PRO ULTIMATE
</h1>

<div class="space-y-4">

<div>
<div class="label">Power (kW)</div>
<input type="number" id="power" value="15">
</div>

<div>
<div class="label">Input Speed (RPM)</div>
<input type="number" id="rpm" value="1200">
</div>

<div class="grid grid-cols-2 gap-3">

<div>
<div class="label">Pinion Teeth</div>
<input type="number" id="z1" value="20">
</div>

<div>
<div class="label">Gear Teeth</div>
<input type="number" id="z2" value="50">
</div>

</div>

<div>
<div class="label">Module</div>
<select id="module">
<option>2</option>
<option selected>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
</select>
</div>

<div>
<div class="label">Gear Material</div>
<select id="material">
<option value="steel" selected>Steel</option>
<option value="castiron">Cast Iron</option>
<option value="aluminum">Aluminum</option>
</select>
</div>

<button
onclick="updateDesign()"
class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg py-3 font-bold mt-4">

UPDATE DESIGN

</button>

<div id="results" class="card"></div>

</div>

</div>

<!-- RENDER -->
<div class="flex-1">
<div id="render-area"></div>
</div>

</div>

<script>

let scene,camera,renderer,controls;
let gearboxGroup;
let casingGroup;

const casingClearance = 13;

const densities = {
    steel:7850,
    castiron:7200,
    aluminum:2700
};

init();
updateDesign();

function init(){

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    camera = new THREE.PerspectiveCamera(
        40,
        window.innerWidth/window.innerHeight,
        1,
        5000
    );

    camera.position.set(0,160,240);

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(window.innerWidth,window.innerHeight);

    document
        .getElementById("render-area")
        .appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

    controls.enableDamping = true;

    const amb = new THREE.AmbientLight(
        0xffffff,
        0.5
    );

    scene.add(amb);

    const dir = new THREE.DirectionalLight(
        0xffffff,
        1
    );

    dir.position.set(100,200,100);

    scene.add(dir);

    gearboxGroup = new THREE.Group();
    scene.add(gearboxGroup);

    animate();
}

function optimizeModule(z1,z2,m){

    if(z2/z1 > 4)
        m += 1;

    if(z1 < 18)
        m += 1;

    return m;
}

function calculateTorque(power,rpm){

    return (9550 * power)/rpm;
}

function calculateShaftDiameter(power,rpm){

    const torque = calculateTorque(power,rpm);

    const T = torque * 1000;

    const tau = 55;

    return Math.cbrt(
        (16*T)/(Math.PI*tau)
    );
}

function createGear(
    teeth,
    module,
    color
){

    const pitchRadius =
        (teeth * module)/2;

    const rootRadius =
        pitchRadius - 1.25*module;

    const thickness =
        10 * module;

    const group = new THREE.Group();

    // BODY
    const bodyGeo =
        new THREE.CylinderGeometry(
            rootRadius,
            rootRadius,
            thickness,
            80
        );

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color,
            metalness:.5,
            roughness:.3
        });

    const body =
        new THREE.Mesh(bodyGeo,bodyMat);

    body.rotation.x = Math.PI/2;

    group.add(body);

    // TEETH
    for(let i=0;i<teeth;i++){

        const toothGeo =
            new THREE.BoxGeometry(
                module*1.4,
                thickness,
                module*2.4
            );

        const tooth =
            new THREE.Mesh(
                toothGeo,
                bodyMat
            );

        const angle =
            (i/teeth)*Math.PI*2;

        tooth.position.x =
            Math.cos(angle) *
            (pitchRadius);

        tooth.position.z =
            Math.sin(angle) *
            (pitchRadius);

        tooth.rotation.y = angle;

        group.add(tooth);
    }

    return {
        mesh:group,
        radius:pitchRadius,
        width:thickness
    };
}

function createShaft(length,dia){

    const geo =
        new THREE.CylinderGeometry(
            dia/2,
            dia/2,
            length,
            48
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0xcbd5e1,
            metalness:.9,
            roughness:.2
        });

    const shaft =
        new THREE.Mesh(geo,mat);

    shaft.rotation.z = Math.PI/2;

    return shaft;
}

function createSplineShaft(
    length,
    dia
){

    const group = new THREE.Group();

    const shaft =
        createShaft(length,dia);

    group.add(shaft);

    // splines
    for(let i=0;i<12;i++){

        const geo =
            new THREE.BoxGeometry(
                length*.45,
                dia*.14,
                dia*.14
            );

        const mat =
            new THREE.MeshStandardMaterial({
                color:0xe2e8f0,
                metalness:1,
                roughness:.1
            });

        const spline =
            new THREE.Mesh(geo,mat);

        const angle =
            (i/12) * Math.PI*2;

        spline.position.y =
            Math.cos(angle)*(dia/2);

        spline.position.z =
            Math.sin(angle)*(dia/2);

        group.add(spline);
    }

    return group;
}

function createBearing(dia){

    const geo =
        new THREE.CylinderGeometry(
            dia,
            dia,
            12,
            32
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x475569,
            metalness:.8,
            roughness:.2
        });

    const bearing =
        new THREE.Mesh(geo,mat);

    bearing.rotation.z = Math.PI/2;

    return bearing;
}

function createHousing(bounds){

    if(casingGroup)
        scene.remove(casingGroup);

    const size = new THREE.Vector3();
    const center = new THREE.Vector3();

    bounds.getSize(size);
    bounds.getCenter(center);

    const housingX =
        size.x + casingClearance*2;

    const housingY =
        size.y + casingClearance*2;

    const housingZ =
        size.z + casingClearance*2;

    casingGroup = new THREE.Group();

    // LOWER
    const lowerGeo =
        new THREE.BoxGeometry(
            housingX,
            housingY/2,
            housingZ
        );

    const lowerMat =
        new THREE.MeshPhysicalMaterial({
            color:0x334155,
            transparent:true,
            opacity:.35,
            transmission:.2,
            roughness:.1
        });

    const lower =
        new THREE.Mesh(
            lowerGeo,
            lowerMat
        );

    lower.position.y =
        -housingY/4;

    casingGroup.add(lower);

    // TOP CAP
    const topGeo =
        new THREE.BoxGeometry(
            housingX,
            housingY/2,
            housingZ
        );

    const topMat =
        new THREE.MeshPhysicalMaterial({
            color:0x64748b,
            transparent:true,
            opacity:.22,
            transmission:.2
        });

    const top =
        new THREE.Mesh(topGeo,topMat);

    top.position.y =
        housingY/4;

    casingGroup.add(top);

    // FLANGE
    const edge =
        new THREE.EdgesGeometry(
            new THREE.BoxGeometry(
                housingX+2,
                2,
                housingZ+2
            )
        );

    const line =
        new THREE.LineSegments(
            edge,
            new THREE.LineBasicMaterial({
                color:0x94a3b8
            })
        );

    casingGroup.add(line);

    casingGroup.position.copy(center);

    scene.add(casingGroup);
}

function calculateGearWeight(
    teeth,
    module,
    width,
    density
){

    const pitch =
        teeth * module;

    const outer =
        pitch + 2*module;

    const radius =
        outer/2;

    const volume =
        Math.PI *
        radius *
        radius *
        width;

    const volumeM3 =
        volume / 1e9;

    return volumeM3 * density;
}

function updateDesign(){

    while(gearboxGroup.children.length)
        gearboxGroup.remove(
            gearboxGroup.children[0]
        );

    const power =
        parseFloat(
            document.getElementById("power").value
        );

    const rpm =
        parseFloat(
            document.getElementById("rpm").value
        );

    const z1 =
        parseInt(
            document.getElementById("z1").value
        );

    const z2 =
        parseInt(
            document.getElementById("z2").value
        );

    let module =
        parseFloat(
            document.getElementById("module").value
        );

    module =
        optimizeModule(
            z1,
            z2,
            module
        );

    const material =
        document.getElementById("material").value;

    const density =
        densities[material];

    // GEARS
    const pinion =
        createGear(
            z1,
            module,
            0x2563eb
        );

    const gear =
        createGear(
            z2,
            module,
            0x16a34a
        );

    const centerDistance =
        pinion.radius +
        gear.radius;

    pinion.mesh.position.x = 0;

    gear.mesh.position.x =
        centerDistance;

    gearboxGroup.add(pinion.mesh);
    gearboxGroup.add(gear.mesh);

    // SHAFTS
    const shaftDia =
        Math.max(
            18,
            calculateShaftDiameter(
                power,
                rpm
            )
        );

    const shaftLength =
        module*18;

    const shaft1 =
        createShaft(
            shaftLength,
            shaftDia
        );

    shaft1.position.x = 0;

    gearboxGroup.add(shaft1);

    const shaft2 =
        createSplineShaft(
            shaftLength+25,
            shaftDia*1.15
        );

    shaft2.position.x =
        centerDistance;

    gearboxGroup.add(shaft2);

    // BEARINGS
    const b1 =
        createBearing(
            shaftDia*.8
        );

    b1.position.x = 0;

    gearboxGroup.add(b1);

    const b2 =
        createBearing(
            shaftDia*.8
        );

    b2.position.x =
        centerDistance;

    gearboxGroup.add(b2);

    // CASING
    const bounds =
        new THREE.Box3()
            .setFromObject(
                gearboxGroup
            );

    createHousing(bounds);

    // WEIGHT
    let totalWeight = 0;

    totalWeight +=
        calculateGearWeight(
            z1,
            module,
            pinion.width,
            density
        );

    totalWeight +=
        calculateGearWeight(
            z2,
            module,
            gear.width,
            density
        );

    // TORQUE
    const torque =
        calculateTorque(
            power,
            rpm
        );

    // OUTPUT
    document.getElementById("results").innerHTML = `

    <div class="title">
    Design Results
    </div>

    <div class="space-y-2 text-[12px]">

    <div>
    Optimized Module:
    <span class="text-blue-400 font-bold">
    ${module.toFixed(1)} mm
    </span>
    </div>

    <div>
    Gear Ratio:
    <span class="text-emerald-400 font-bold">
    ${(z2/z1).toFixed(2)}
    </span>
    </div>

    <div>
    Torque:
    <span class="text-amber-400 font-bold">
    ${torque.toFixed(2)} Nm
    </span>
    </div>

    <div>
    Shaft Diameter:
    <span class="text-pink-400 font-bold">
    ${shaftDia.toFixed(2)} mm
    </span>
    </div>

    <div>
    Exact Housing Clearance:
    <span class="text-cyan-400 font-bold">
    13 mm
    </span>
    </div>

    <div>
    Material Density:
    <span class="text-purple-400 font-bold">
    ${density} kg/m³
    </span>
    </div>

    <div>
    Total Gear Train Weight:
    <span class="text-red-400 font-bold">
    ${totalWeight.toFixed(2)} kg
    </span>
    </div>

    <div class="pt-2 border-t border-slate-700">

    <div class="text-green-400 font-bold">
    ✓ Split Gearbox Housing
    </div>

    <div class="text-green-400 font-bold">
    ✓ Top Removable Cap
    </div>

    <div class="text-green-400 font-bold">
    ✓ Spline Output Shaft
    </div>

    <div class="text-green-400 font-bold">
    ✓ Bearing Supports
    </div>

    <div class="text-green-400 font-bold">
    ✓ Compact 13 mm Clearance
    </div>

    </div>

    </div>
    `;
}

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    gearboxGroup.children.forEach((obj,index)=>{

        if(index === 0)
            obj.rotation.y += 0.02;

        if(index === 1)
            obj.rotation.y -= 0.008;
    });

    renderer.render(
        scene,
        camera
    );
}

</script>
</body>
</html>
